name: Invalidations

on:
  pull_request:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    # Only run on PRs to the default branch.
    # In the PR trigger above branches can be specified only explicitly whereas this check should work for master, main, or any other default branch
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Julia
      run: python .github/scripts/install-julia.py "1" "${{ runner.os }}" "x64"
    - name: Save invalidation script
      run: cp .github/scripts/count-invalidations.jl "$RUNNER_TEMP/count-invalidations.jl"
    - name: Build package
      run: julia --color=yes --project=. -e 'using Pkg; Pkg.build()'
    - name: Count invalidations on branch
      id: invs_pr
      run: julia --color=yes "$RUNNER_TEMP/count-invalidations.jl"

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
    - name: Build default branch
      run: julia --color=yes --project=. -e 'using Pkg; Pkg.build()'
    - name: Count invalidations on default branch
      id: invs_default
      run: julia --color=yes "$RUNNER_TEMP/count-invalidations.jl"
    
    - name: Report invalidation counts
      run: |
        echo "Invalidations on default branch: ${{ steps.invs_default.outputs.total }} (${{ steps.invs_default.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
        echo "This branch: ${{ steps.invs_pr.outputs.total }} (${{ steps.invs_pr.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
    - name: Check if the PR does increase number of invalidations
      if: steps.invs_pr.outputs.total > steps.invs_default.outputs.total
      run: exit 1
