name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1' # automatically expands to the latest stable 1.x release of Julia
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macOS-latest
            arch: aarch64
          - os: windows-latest
            arch: x64
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ref="${{ github.event.pull_request.head.sha }}"
          else
            ref="$GITHUB_SHA"
          fi
          git fetch --no-tags --depth=1 origin "$ref"
          git checkout --force FETCH_HEAD
      - name: Install Julia
        run: python .github/scripts/install-julia.py "${{ matrix.version }}" "${{ runner.os }}" "${{ matrix.arch }}"
      - name: Julia version
        run: julia --color=yes -e 'using InteractiveUtils; versioninfo()'
      - name: Build package
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.build()'
      - name: Run tests
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test()'
  auth-modes:
    name: Auth ${{ matrix.auth }} - Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth:
          - scram-sha-256
          - md5
    env:
      POSTGRES_HOST_AUTH_METHOD: ${{ matrix.auth }}
      POSTGRES_INITDB_ARGS: --auth-host=${{ matrix.auth }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ref="${{ github.event.pull_request.head.sha }}"
          else
            ref="$GITHUB_SHA"
          fi
          git fetch --no-tags --depth=1 origin "$ref"
          git checkout --force FETCH_HEAD
      - name: Install Julia
        run: python .github/scripts/install-julia.py "1" "${{ runner.os }}" "x64"
      - name: Build package
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.build()'
      - name: Run tests
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test()'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ref="${{ github.event.pull_request.head.sha }}"
          else
            ref="$GITHUB_SHA"
          fi
          git fetch --no-tags --depth=1 origin "$ref"
          git checkout --force FETCH_HEAD
      - name: Install Julia
        run: python .github/scripts/install-julia.py "1" "${{ runner.os }}" "x64"
      - run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
        env:
          POSTGRES_DOCS_DEPLOY: ${{ github.event_name == 'push' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
